name: bootstrap
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and extract package
        run: |
          curl -fL -o /tmp/pkg.tar.gz "https://muse.ai/files/1252283737977069/1006027738464795/f38e4tcs5twkashhdu77v2ll/hongguo-web-v2-deploy.tar.gz"
          tar -xzf /tmp/pkg.tar.gz -C .
          rm -rf .github
      - name: Commit package
        run: |
          git config user.name "bootstrap"
          git config user.email "bootstrap@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Import hongguo-web-v2 deploy package"
          git push
